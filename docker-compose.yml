services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: service_desk
      POSTGRES_USER: service
      POSTGRES_PASSWORD: service
    volumes: ["service-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U service -d service_desk"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://service:service@db:5432/service_desk
      DIRECT_URL: postgresql://service:service@db:5432/service_desk
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  service-data:
